[package]
name = "dispatch"
version = "0.4.8"
edition = "2024"
description = "Keep coding-agent work valid while the code moves: isolated runs and coherence-checked apply"
license = "MIT"
repository = "https://github.com/rundispatch/dispatch"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "=0.29.0"
dirs = "6.0"
futures = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.9"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = "=0.9.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1.1"
tempfile = "3.20"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
ulid = { version = "1.2", features = ["serde"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
strip = true
lto = "thin"
