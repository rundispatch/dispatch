name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this suite on the tag before it builds any asset.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # Linux: the test image, through the same script as locally. Its target/
      # and registry are host directories here, so actions/cache keeps them.
      - name: Cache Cargo (Linux test image)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: Standard validation in the test image
        if: runner.os == 'Linux'
        env:
          DISPATCH_DOCKER_TARGET_DIR: ${{ runner.temp }}/cargo-target
          DISPATCH_DOCKER_CARGO_REGISTRY: ${{ runner.temp }}/cargo-registry
        run: |
          mkdir -p "$DISPATCH_DOCKER_TARGET_DIR" "$DISPATCH_DOCKER_CARGO_REGISTRY"
          scripts/test-in-docker.sh

      # macOS: natively, with the toolchain the test image pins.
      - name: Cache Cargo (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Standard validation (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The suite on a loaded machine: stress mode in the test image (2 CPUs, 16
  # busy loops competing for them, 8 test threads). A test that assumes a fast
  # machine, or a product wait that gives up while the work is still
  # progressing, fails here first. The tests are built without the load.
  stress:
    name: tests under load (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Cache Cargo (Linux test image)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: cargo-ubuntu-22.04-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ubuntu-22.04-
      - name: Build the tests, then run them in stress mode
        env:
          DISPATCH_DOCKER_TARGET_DIR: ${{ runner.temp }}/cargo-target
          DISPATCH_DOCKER_CARGO_REGISTRY: ${{ runner.temp }}/cargo-registry
        run: |
          mkdir -p "$DISPATCH_DOCKER_TARGET_DIR" "$DISPATCH_DOCKER_CARGO_REGISTRY"
          scripts/test-in-docker.sh cargo test --locked --no-run
          DISPATCH_DOCKER_STRESS=1 scripts/test-in-docker.sh cargo test --locked --no-fail-fast
