name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this suite on the tag before it builds any asset.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # Linux: the test image, through the same script as locally. Its target/
      # and registry are host directories here, so actions/cache keeps them.
      - name: Cache Cargo (Linux test image)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-target
            ${{ runner.temp }}/cargo-registry
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: Standard validation in the test image
        if: runner.os == 'Linux'
        env:
          DISPATCH_DOCKER_TARGET_DIR: ${{ runner.temp }}/cargo-target
          DISPATCH_DOCKER_CARGO_REGISTRY: ${{ runner.temp }}/cargo-registry
        run: |
          mkdir -p "$DISPATCH_DOCKER_TARGET_DIR" "$DISPATCH_DOCKER_CARGO_REGISTRY"
          scripts/test-in-docker.sh

      # macOS: natively, with the toolchain the test image pins.
      - name: Cache Cargo (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Standard validation (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
